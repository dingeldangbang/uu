name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify (Debug-Build · Tests · Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble Debug
        run: ./gradlew --no-daemon --console=plain assembleDebug

      - name: Unit Tests
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon --console=plain lintDebug
        continue-on-error: true

      - name: Upload Debug-APK
        uses: actions/upload-artifact@v4
        with:
          name: secureguard-debug
          path: app/build/outputs/apk/debug/*.apk
