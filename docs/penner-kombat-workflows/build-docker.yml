name: 🐳 Build via Docker Compose

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]

permissions:
  contents: write                            # Release-Assets anhängen

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build APK via docker compose
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          docker compose build secureguard
          docker compose run --rm --no-deps secureguard

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: secureguard-pro.apk
          path: dist/*.apk
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "🛡️ wischiwaschi Pro (Docker Build) ${{ github.ref_name }}"
          body: |
            ## 🛡️ wischiwaschi (Docker-Build)

            Diese Variante wurde via Docker-Compose reproduzierbar gebaut.

            ### 📦 Download
            - **APK**: secureguard-pro.apk
          files: |
            dist/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
