name: 🩸 Penner Kombat — CI Build

on:
  push:
    branches: [ main, develop, "arena/**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  build:
    name: 📦 Build Penner Kombat APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Decode Keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/secureguard-keystore.jks
            echo "Keystore decoded"
          else
            echo "No keystore - building unsigned"
          fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned if no keystore)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace || ./gradlew assembleDebug --no-daemon

      - name: Rename APKs to Penner Kombat
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/penner-kombat-debug.apk || true
          cp app/build/outputs/apk/release/*.apk dist/penner-kombat-release.apk || cp dist/penner-kombat-debug.apk dist/penner-kombat-release.apk
          ls -lh dist/
          echo "APK ready: $(ls dist/*.apk)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: penner-kombat-debug.apk
          path: dist/penner-kombat-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: penner-kombat-release.apk
          path: dist/penner-kombat-release.apk
          retention-days: 60

      - name: APK Info
        run: |
          for f in dist/*.apk; do
            echo "=== $f ==="
            ls -lh "$f"
            sha256sum "$f" || true
          done
