plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.parcelize'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.dagger.hilt.android'
}

android {
    namespace 'com.secureguard.enterprise'
    compileSdk 34

    defaultConfig {
        applicationId "com.pennerkambat.game"
        minSdk 29
        targetSdk 34
        versionCode 100
        versionName "1.0.0-penner-kombat-bahnhof"
        vectorDrawables {
            useSupportLibrary true
        }

        // ────── BuildConfig — API-Keys (leer im Pilot) ──────
        buildConfigField "String", "WIGLE_API_KEY",          "\"\""
        buildConfigField "String", "OPEN_CHARGE_MAP_KEY",   "\"\""
        buildConfigField "String", "NETATMO_TOKEN",          "\"\""
        buildConfigField "String", "GOOGLE_API_KEY",        "\"\""
        buildConfigField "String", "HELIUM_API_KEY",        "\"\""
        buildConfigField "String", "DHL_API_KEY",           "\"\""
        buildConfigField "String", "MQTT_BROKER_URL",      "\"tcp://localhost:1883\""
        buildConfigField "String", "WEBSOCKET_URL",         "\"wss://localhost/ws\""
        buildConfigField "String", "MCP_PROVIDER",          "\"freecustom\""
    }

    // Signatur: nur wenn CI/Dev-Umgebung die Secrets bereitstellt.
    // Ohne Secrets baut assembleRelease als unsigned Check-Build
    // (lokale Entwicklung + CI-Smoke-Tests ohne Keystore).
    def storePasswordEnv = System.getenv("KEYSTORE_PASSWORD")

    signingConfigs {
        release {
            storeFile file('secureguard-keystore.jks')
            storePassword storePasswordEnv
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (storePasswordEnv != null && !storePasswordEnv.isBlank()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.4'
    }

    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/LICENSE*',
                '/META-INF/NOTICE*',
                '/META-INF/DEPENDENCIES',
                '/META-INF/INDEX.LIST'
            ]
        }
    }
}

dependencies {
    // Core / AndroidX
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-service:2.7.0'
    implementation 'androidx.activity:activity-compose:1.8.2'
    implementation 'androidx.work:work-runtime-ktx:2.9.0'

    // Security / Crypto
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    // Inter-Fonts via Downloadable Fonts (Google Fonts Provider, mit Fallback)
    implementation 'androidx.compose.ui:ui-text-google-fonts'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // ViewModel + Runtime-Compose
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'

    // Hilt
    implementation 'com.google.dagger:hilt-android:2.48'
    kapt 'com.google.dagger:hilt-compiler:2.48'
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'
    implementation 'androidx.hilt:hilt-work:1.2.0'
    kapt 'androidx.hilt:hilt-compiler:1.2.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // OSM (osmdroid)
    implementation 'org.osmdroid:osmdroid-android:6.1.18'

    // Preference (für OSMDroid-Config)
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // Location / Bluetooth / Permissions
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'no.nordicsemi.android:ble-ktx:2.6.1'
    implementation 'com.google.accompanist:accompanist-permissions:0.32.0'

    // Image loading
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // ML-Kit Vision (object detection hook)
    implementation 'com.google.mlkit:object-detection:17.0.1'

    // 🔃 CameraX (echte Kamera-Pipeline für OpticalService)
    implementation "androidx.camera:camera-core:1.3.1"
    implementation "androidx.camera:camera-camera2:1.3.1"
    implementation "androidx.camera:camera-lifecycle:1.3.1"
    implementation "androidx.camera:camera-view:1.3.1"

    // 🔃 Honeywell DataCollection SDK (CT45P / Android 11)
    // Das echte SDK wird nur über das Honeywell Tech-Portal als AAR verteilt
    // (nicht in öffentlichen Maven-Repos). Daher kompiliert die App gegen den
    // Build-Zeit-Stub `:aidc-stub` (com.honeywell.aidc.* — BarcodeReader.from()
    // liefert null → Scanner ehrlich "nicht verfügbar").
    // Echtes AAR einbinden: app/libs/aidc.aar ablegen und diese Zeile ersetzen durch:
    //     implementation fileTree(dir: 'libs', include: ['*.aar'])
    // (CI-Check: Workflow honeywell-experimental.yml)
    implementation project(':aidc-stub')

    // 📧 Temporäre E-Mail / MCP + API-Node-Manager
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'com.google.code.gson:gson:2.10.1'

    // ────────────────────────── Test-Deps (CI/Local) ──────────────────────────
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation 'androidx.lifecycle:lifecycle-runtime-testing:2.7.0'
    testImplementation 'androidx.work:work-testing:2.9.0'
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'org.robolectric:robolectric:4.11.1'
    testImplementation 'androidx.test.ext:junit:1.1.5'
    testImplementation 'org.mockito:mockito-core:5.5.0'
    testImplementation 'org.mockito.kotlin:mockito-kotlin:5.1.0'

    // ────────────────────────── AndroidTest ──────────────────────────
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // ── Ergänzt 2026-Q4 — Maven (war außerhalb des deps-Blocks): ──
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.startup:startup-runtime:1.1.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.squareup.moshi:moshi:1.15.1'
    implementation 'com.squareup.moshi:moshi-kotlin:1.15.1'
    implementation 'com.squareup.retrofit2:converter-moshi:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'
    implementation 'androidx.compose.material3:material3-window-size-class:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.7.0'
}

