name: Android release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-30" "platforms;android-36" "build-tools;35.0.0"
      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not configured" >&2; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "ANDROID_KEYSTORE_PASSWORD is not configured" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "ANDROID_KEY_ALIAS is not configured" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "ANDROID_KEY_PASSWORD is not configured" >&2; exit 1; }
          mkdir -p .secrets
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > .secrets/agent-mobile-release.jks
          cat > .secrets/keystore.properties <<EOF
          storeFile=.secrets/agent-mobile-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          chmod 600 .secrets/agent-mobile-release.jks .secrets/keystore.properties
      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --stacktrace --console=plain
      - name: Verify release APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" | tee app-release.apk.sha256
      - name: Upload signed release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-mobile-release-${{ github.ref_name }}
          path: |
            app/build/outputs/apk/release/app-release.apk
            app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            app-release.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Agent Mobile $GITHUB_REF_NAME" \
            --generate-notes
      - name: Remove signing material
        if: always()
        run: rm -rf .secrets
