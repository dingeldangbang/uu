name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-30" "platforms;android-36" "build-tools;35.0.0"
      - name: Unit tests
        id: unit_tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee build.log
      - name: Publish Gradle diagnostics
        if: always()
        run: |
          {
            echo '## Gradle diagnostics'
            echo '```text'
            tail -n 300 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ steps.unit_tests.outcome }}" == "failure" && -f build.log ]]; then
            diagnostic_lines="$(grep -E 'What went wrong|Caused by:|Could not|FAILURE:|error:|e: ' build.log | tail -n 40 | tr '\n' ' ' || true)"
            echo "::error::Gradle diagnostics: ${diagnostic_lines}"
            tail -n 40 build.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-mobile-gradle-diagnostics
          path: build.log
      - name: Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain
      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
